<!doctype html>
<!-- Redesigned with tasteskill 2.5.1 (design-taste-frontend). Same look as index.html:
     kit in assets/, shared fonts and palette in css/theme.css, page CSS in css/tactics.css. -->
<html lang="en" data-type="software" data-radius="soft" data-buttons="tonal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tactics board: every Madrid goal, move by move</title>
<meta name="description" content="Watch Real Madrid's goals from the big games move by move on an animated tactics board.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f8f8f8">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="assets/system.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/tactics.css">
</head>
<body class="board-page">

<header class="nav">
  <div class="wrap nav__bar">
    <a class="skip-link" href="#board">Skip to the board</a>
    <a class="nav__logo" href="index.html"><span class="mark" data-mark="arc" aria-hidden="true"></span>Madrid Tactics</a>
    <nav class="nav__links" aria-label="Main">
      <div class="nav__item"><a class="nav__link" href="index.html">Dashboard</a></div>
      <div class="nav__item"><a class="nav__link" href="tactics.html" aria-current="page">Tactics board</a></div>
      <div class="nav__item"><a class="nav__link" id="nav-graphic" href="match.html">Match graphic</a></div>
    </nav>
    <div class="nav__actions"></div>
    <button class="nav__toggle" type="button" aria-expanded="false" aria-label="Menu">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 5h14M2 13h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<main id="board" class="board-main">
  <div class="wrap">
    <div class="board-head">
      <div>
        <p class="board-match muted" id="b-match"></p>
        <h1 id="b-title"></h1>
      </div>
      <div class="goal-tabs" id="goal-tabs" role="tablist" aria-label="Goals"></div>
    </div>

    <div class="board-wrap" id="board-wrap">
      <svg id="pitch" viewBox="-20 -20 1090 720" role="img" aria-label="Animated tactics board"></svg>
      <div class="rec-caption" id="rec-caption">
        <p class="rec-step" id="rec-step"></p>
        <p class="rec-title" id="rec-title"></p>
      </div>
      <div class="goal-flash" id="goal-flash" aria-hidden="true">Goal</div>
    </div>

    <div class="board-controls">
      <button class="btn btn--secondary ctl" id="prev" type="button" aria-label="Previous step">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>
      </button>
      <button class="btn btn--primary" id="play" type="button">Play</button>
      <button class="btn btn--secondary ctl" id="next" type="button" aria-label="Next step">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg>
      </button>
      <div class="step-dots" id="dots"></div>
      <button class="btn btn--secondary rec-btn" id="rec" type="button" title="Shows only the board, for screen recording. Esc to leave.">Record mode</button>
    </div>

    <div class="board-notes">
      <div class="step-now" aria-live="polite">
        <p class="step-count muted" id="s-num"></p>
        <p class="step-title" id="s-title"></p>
        <p class="step-text" id="s-text"></p>
      </div>
      <div class="board-side">
        <p class="board-summary" id="b-summary"></p>
        <ul class="board-legend" aria-label="Key">
          <li><i class="lg-dot rm"></i>Real Madrid</li>
          <li><i class="lg-dot opp"></i><span id="lg-opp">Opponent</span></li>
          <li><i class="lg-line pass"></i>Pass or shot</li>
          <li><i class="lg-line carry"></i>Carry</li>
          <li><i class="lg-line run"></i>Run</li>
          <li><i class="lg-zone"></i>Space</li>
        </ul>
        <p class="board-note muted">Positions are read from the broadcast highlights, so they're approximate. Madrid always attack to the right.</p>
      </div>
    </div>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/boards.js"></script>
<script src="js/tactics.js"></script>
<script src="js/pwa.js"></script>
<script type="module" src="assets/system.js"></script>
</body>
</html>
